[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["F821", "BLE001", "RUF013", "PERF102", "E402", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["routers", "models", "security", "logging_config", "services", "clients"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.setuptools]
packages = ["routers", "services", "clients"]

[project]
name = "proxmox-mcp"
version = "0.6.0"
