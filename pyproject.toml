[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["F821", "BLE001", "RUF013", "PERF102", "E402", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["routers", "models", "security", "logging_config", "services", "clients", "exceptions", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "clustermcp"
version = "0.8.0-dev"
description = "ClusterMCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cluster = "cluster_cli:main"

[tool.setuptools]
py-modules = ["cluster_cli", "main", "models", "config", "security", "logging_config", "pve_client", "exceptions"]

[tool.setuptools.packages.find]
where = ["."]
include = ["routers*", "services*", "clients*"]
exclude = ["tests*", "references*"]
